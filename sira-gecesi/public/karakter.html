<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Hamam Böceği — karakter testi</title>
<style>html,body{margin:0;height:100%;background:#0b0705;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { makeRoach } from './js/hamambocegi.js';

const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#140a06');
scene.fog = new THREE.Fog('#140a06', 6, 14);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;
const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 50);
camera.position.set(0.15, 1.45, 7.4);
camera.lookAt(0, 0.6, 0.2);

// ---------- dokular ----------
function tex(w, h, draw, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
  return t;
}
// kilim: kırmızı zemin, lacivert/altın baklava motifleri
function kilim(pal = ['#8f1d22', '#1f2a4d', '#d9a441', '#efe2c4', '#5a1416'], scale = 1) {
  return tex(512, 512, (x, w, h) => {
    x.fillStyle = pal[0]; x.fillRect(0, 0, w, h);
    const s = 64 * scale;
    for (let y = 0; y < h + s; y += s) for (let xx = 0; xx < w + s; xx += s) {
      const d = (cx, cy, r, col) => { x.fillStyle = col; x.beginPath(); x.moveTo(cx, cy - r); x.lineTo(cx + r, cy); x.lineTo(cx, cy + r); x.lineTo(cx - r, cy); x.closePath(); x.fill(); };
      d(xx, y, s * 0.46, pal[1]); d(xx, y, s * 0.32, pal[2]); d(xx, y, s * 0.18, pal[0]); d(xx, y, s * 0.07, pal[3]);
    }
    x.fillStyle = pal[4]; for (let i = 0; i < w; i += 8) x.fillRect(i, 0, 3, 10), x.fillRect(i, h - 10, 3, 10);
    for (let i = 0; i < 4000; i++) { x.fillStyle = `rgba(0,0,0,${Math.random() * 0.08})`; x.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  });
}
const plaster = tex(512, 512, (x, w, h) => {
  x.fillStyle = '#7c6446'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 900; i++) { x.fillStyle = `rgba(${Math.random() < 0.5 ? '60,40,20' : '255,240,210'},${Math.random() * 0.07})`; x.beginPath(); x.arc(Math.random() * w, Math.random() * h, 2 + Math.random() * 20, 0, 7); x.fill(); }
  const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(40,20,5,.35)'); x.fillStyle = g; x.fillRect(0, 0, w, h);
}, [3, 2]);

// ---------- oda ----------
const add = (geo, mat, pos, rot) => { const m = new THREE.Mesh(geo, mat); m.position.copy(pos); if (rot) m.rotation.set(...rot); m.castShadow = m.receiveShadow = true; scene.add(m); return m; };
const v = (x, y, z) => new THREE.Vector3(x, y, z);
add(new THREE.PlaneGeometry(14, 10), new THREE.MeshStandardMaterial({ color: '#4a2d1a', roughness: 0.9 }), v(0, -0.42, 0), [-Math.PI / 2, 0, 0]);
add(new THREE.PlaneGeometry(3.6, 2.4), new THREE.MeshStandardMaterial({ map: kilim(undefined, 1.2), roughness: 0.95 }), v(0, -0.41, 0.6), [-Math.PI / 2, 0, 0]);
add(new THREE.PlaneGeometry(14, 6), new THREE.MeshStandardMaterial({ map: plaster, roughness: 0.95 }), v(0, 2.5, -0.8));
// duvarda çerçeveli resim
add(new THREE.BoxGeometry(0.9, 0.62, 0.04), new THREE.MeshStandardMaterial({ color: '#5a3a1c', roughness: 0.5 }), v(0.9, 1.9, -0.77));
add(new THREE.PlaneGeometry(0.78, 0.5), new THREE.MeshStandardMaterial({ map: tex(256, 160, (x, w, h) => { const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#8fa3a8'); g.addColorStop(1, '#4d5b40'); x.fillStyle = g; x.fillRect(0, 0, w, h); x.fillStyle = '#2f3a2a'; x.beginPath(); x.moveTo(0, h * 0.7); x.lineTo(w * 0.3, h * 0.45); x.lineTo(w * 0.6, h * 0.62); x.lineTo(w, h * 0.4); x.lineTo(w, h); x.lineTo(0, h); x.fill(); }), roughness: 0.7 }), v(0.9, 1.9, -0.745));

// minder + sırt yastıkları
add(new RoundedBoxGeometry(5.4, 0.42, 0.95, 5, 0.1), new THREE.MeshStandardMaterial({ map: kilim(['#7a1a1e', '#233056', '#c99a3e', '#eadcbc', '#4a1214'], 0.8), roughness: 0.9 }), v(0, -0.21, 0.05));
for (const sx of [-2.1, -1.05, 0, 1.05, 2.1]) add(new RoundedBoxGeometry(0.95, 0.6, 0.22, 5, 0.1), new THREE.MeshStandardMaterial({ map: kilim(['#9a5a1a', '#3b1a2a', '#e8c070', '#f3e6c8', '#5a2a10'], 0.7), roughness: 0.9 }), v(sx, 0.27, -0.52), [-0.18, 0, 0]);

// bakır sini, çay bardakları, çiğ köfte
const brass = new THREE.MeshStandardMaterial({ color: '#c08a3e', metalness: 0.9, roughness: 0.32 });
add(new THREE.CylinderGeometry(0.55, 0.55, 0.035, 48), brass, v(0, -0.08, 1.15));
for (const a of [0, 1.2, 2.4, 3.6, 4.8]) add(new THREE.CylinderGeometry(0.02, 0.02, 0.32, 8), new THREE.MeshStandardMaterial({ color: '#3a2412' }), v(Math.cos(a) * 0.4, -0.25, 1.15 + Math.sin(a) * 0.4));
const glassMat = new THREE.MeshPhysicalMaterial({ color: '#ffffff', roughness: 0.05, transmission: 1, thickness: 0.02, ior: 1.5, transparent: true });
const teaMat = new THREE.MeshPhysicalMaterial({ color: '#a8320a', roughness: 0.1, transmission: 0.6, thickness: 0.05, emissive: '#3a0a00', emissiveIntensity: 0.3 });
const tulip = [[0.0, 0], [0.032, 0.0], [0.03, 0.04], [0.024, 0.07], [0.03, 0.105], [0.036, 0.13]].map(([x, y]) => new THREE.Vector2(x, y));
for (const [x, z] of [[-0.3, 1.05], [0.32, 1.0], [0.1, 1.38]]) {
  add(new THREE.CylinderGeometry(0.05, 0.05, 0.008, 24), new THREE.MeshStandardMaterial({ color: '#e9e4da', roughness: 0.3 }), v(x, -0.058, z));
  add(new THREE.LatheGeometry(tulip.map((p) => p.clone().multiplyScalar(1)), 24), teaMat, v(x, -0.055, z)).scale.set(0.9, 0.85, 0.9);
  add(new THREE.LatheGeometry(tulip, 24), glassMat, v(x, -0.055, z));
}
add(new THREE.CylinderGeometry(0.2, 0.16, 0.025, 32), new THREE.MeshStandardMaterial({ color: '#f1ece2', roughness: 0.35 }), v(-0.02, -0.05, 1.2));
const kofte = new THREE.MeshStandardMaterial({ color: '#8f2a16', roughness: 0.75 });
for (let i = 0; i < 9; i++) { const a = (i / 9) * Math.PI * 2; const k = add(new THREE.SphereGeometry(1, 16, 12), kofte, v(-0.02 + Math.cos(a) * 0.11, -0.025, 1.2 + Math.sin(a) * 0.11), [0, -a, 0]); k.scale.set(0.045, 0.022, 0.02); }
for (let i = 0; i < 5; i++) { const a = (i / 5) * Math.PI * 2 + 0.3; const l = add(new THREE.SphereGeometry(1, 12, 8), new THREE.MeshStandardMaterial({ color: '#4f8f2f', roughness: 0.6 }), v(-0.02 + Math.cos(a) * 0.05, -0.03, 1.2 + Math.sin(a) * 0.05), [0, a, 0]); l.scale.set(0.06, 0.008, 0.03); }

// ---------- karakterler ----------
const roaches = [
  makeRoach({ kiyafet: 'yelek', renk1: '#1b1b1f', kafa: 'sapka', kafaRenk: '#2b2b30', ayakkabi: 'spor', seed: 11 }),
  makeRoach({ kiyafet: 'elbise', renk1: '#f2c531', renk2: '#fff3b0', desen: 'cicek', kafa: 'cicek', kafaRenk: '#d62839', kupe: true, ayakkabi: 'topuklu', seed: 4, body: '#8a3a19' }),
  makeRoach({ kiyafet: 'forma', renk1: '#7cc3ec', renk2: '#ffffff', kafa: 'bant', kafaRenk: '#ffffff', ayakkabi: 'spor', seed: 3 }),
  makeRoach({ kiyafet: 'elbise', desen: 'leopar', renk1: '#d9a35a', kafa: 'bere', kafaRenk: '#c1121f', kupe: true, seed: 8, body: '#743016' }),
  makeRoach({ kiyafet: 'atlet', renk1: '#efe9dd', kafa: 'kasket', kafaRenk: '#4a3b2a', seed: 7, body: '#6a2c12', light: '#a65a2a' }),
];
roaches.forEach((r, i) => { r.position.set(-2.1 + i * 1.05, 0.0, 0.1); r.rotation.y = (2 - i) * 0.09; });
roaches.forEach((r) => scene.add(r));

// ---------- ışık ----------
scene.add(new THREE.HemisphereLight('#7f8fc0', '#2a170c', 0.55));
const key = new THREE.DirectionalLight('#ffc58a', 1.5);
key.position.set(2.2, 3.4, 3.2); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
Object.assign(key.shadow.camera, { left: -4, right: 4, top: 3, bottom: -2, near: 0.5, far: 12 });
scene.add(key);
const rim = new THREE.DirectionalLight('#8fb0ff', 0.9); rim.position.set(-2, 2.5, -2); scene.add(rim);
// gaz lambası (sıcak, gölgeli pratik ışık)
const lamp = new THREE.PointLight('#ff9a4a', 9, 6, 1.6); lamp.position.set(-1.45, 1.35, 0.35); lamp.castShadow = true; lamp.shadow.mapSize.set(1024, 1024); lamp.shadow.bias = -0.002; scene.add(lamp);
add(new THREE.SphereGeometry(0.07, 16, 12), new THREE.MeshStandardMaterial({ color: '#ffd59a', emissive: '#ffb050', emissiveIntensity: 6 }), lamp.position.clone()).castShadow = false;
add(new THREE.CylinderGeometry(0.09, 0.07, 0.18, 16, 1, true), new THREE.MeshPhysicalMaterial({ color: '#fff', transmission: 0.9, roughness: 0.1, transparent: true, side: THREE.DoubleSide }), lamp.position.clone()).castShadow = false;

// ---------- efektler: bloom + odak ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new BokehPass(scene, camera, { focus: 7.2, aperture: 0.0008, maxblur: 0.007 }));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.38, 0.55, 0.82));
composer.addPass(new OutputPass());

const clock = new THREE.Clock();
let frames = 0;
function loop() {
  const t = clock.getElapsedTime();
  roaches.forEach((r) => r.userData.update(t, t * 1.6));
  lamp.intensity = 9 + Math.sin(t * 13) * 0.4 + Math.sin(t * 7.3) * 0.3;
  camera.position.x = 0.15 + Math.sin(t * 0.25) * 0.3;
  camera.lookAt(0, 0.6, 0.2);
  composer.render();
  if (++frames === 20) window.__ready = true;
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
